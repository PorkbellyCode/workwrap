<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkWrap directory structure · Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · Diagram Design</p>
    <h1>WorkWrap directory structure</h1>

    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wwtree-title wwtree-desc">
      <title id="wwtree-title">WorkWrap directory structure</title>
      <desc id="wwtree-desc">Tree diagram showing the WorkWrap Next.js project root branching into five top-level directories: app (App Router with pages and API routes), components (UI), lib (business logic and DB access), drizzle (ORM migrations), and config (root configuration files).</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Tier tags -->
      <text x="40" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 0 · ROOT</text>
      <text x="40" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 1 · DIRECTORIES</text>

      <!-- Connectors (drawn first, behind nodes) -->
      <!-- Root drop -->
      <path d="M 500 128 L 500 168" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <!-- Bus spanning tier-1 children -->
      <path d="M 170 168 L 826 168" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <!-- Drops into each child -->
      <path d="M 170 168 L 170 208" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 334 168 L 334 208" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 498 168 L 498 208" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 662 168 L 662 208" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 826 168 L 826 208" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <!-- Root node: workwrap (coral focal) -->
      <rect x="420" y="80" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="80" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="428" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="444" y="97" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
      <text x="500" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">workwrap</text>
      <text x="500" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">next.js 15 · pwa</text>

      <!-- Tier 1: app/ -->
      <rect x="100" y="208" width="140" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="208" width="140" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="108" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="122" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
      <text x="170" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">app/</text>
      <text x="170" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">router · pages + api</text>

      <!-- Tier 1: components/ -->
      <rect x="264" y="208" width="140" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="208" width="140" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="272" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="286" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
      <text x="334" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">components/</text>
      <text x="334" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ui · shadcn</text>

      <!-- Tier 1: lib/ -->
      <rect x="428" y="208" width="140" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="428" y="208" width="140" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="436" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="450" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
      <text x="498" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">lib/</text>
      <text x="498" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">domain logic · db</text>

      <!-- Tier 1: drizzle/ -->
      <rect x="592" y="208" width="140" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="208" width="140" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="600" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="614" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
      <text x="662" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">drizzle/</text>
      <text x="662" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">orm migrations</text>

      <!-- Tier 1: config -->
      <rect x="756" y="208" width="140" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="756" y="208" width="140" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="826" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">config</text>
      <text x="826" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">next · tsconfig ·</text>
      <text x="826" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">drizzle.config</text>

      <!-- Legend strip -->
      <line x1="40" y1="316" x2="960" y2="316" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="348" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="356" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Project root</text>

      <rect x="200" y="348" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="356" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Source directory</text>

      <rect x="380" y="348" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="400" y="356" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Config / root files</text>

      <text x="580" y="356" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Next.js 15 App Router · Drizzle ORM · shadcn/ui</text>

      <!-- Footer note: app/ breakdown -->
      <line x1="40" y1="392" x2="960" y2="392" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">APP/ ROUTES</text>
      <text x="40" y="424" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">pages: dashboard · summary · admin · login · pending</text>
      <text x="40" y="438" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">api: auth · memos · categories · summaries · transcribe · cron/purge-summaries</text>
    </svg>
  </div>
</body>
</html>
